name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# ─────────────────────────────────────────────────────
# 実値は wrangler.toml.real に保管（このファイルから .gitignore で除外）
# デプロイ時は wrangler.toml.real の内容を一時的に反映してから:
#   cp apps/worker/wrangler.toml.real apps/worker/wrangler.toml
#   npx wrangler deploy
#   git checkout apps/worker/wrangler.toml  # placeholder に戻す
# もしくは git update-index --skip-worktree apps/worker/wrangler.toml で
# ローカル編集を git に追跡させない運用にする
# ─────────────────────────────────────────────────────
account_id = "YOUR_ACCOUNT_ID"

[assets]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "line-crm"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[triggers]
crons = ["*/5 * * * *"]
